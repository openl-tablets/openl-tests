rp.description=### Local Zipped Projects — API Validation\n\n\
Walks the local client-projects tree, uploads every ZIP archive into a fresh WebStudio container, then validates each project (open, list modules, check compilation, run tests). Driven entirely via WebStudio REST (no UI).\n\n\
### Run metadata\n\n\
- **Source tree:** `client_projects/customers_projects_test_automation_6.x`\n\n\
### Grouping\n\n\
- ZIPs that live in a folder whose name ends with `deployment` are uploaded **together** into one container, so cross-project dependencies inside the deployment unit resolve.\n\
- Every other ZIP is uploaded standalone into its own container.\n\
- Each group spawns its own TestNG instance via `@Factory`, so containers are never reused between groups.\n\n\
### Per project flow\n\n\
- `PUT /rest/repos/design/projects/{name}` (multipart) — upload one ZIP\n\
- `PATCH /rest/projects/{id}` → status=OPENED (per project, to make it current in session)\n\
- `GET /rest/projects/{id}/modules`\n\
- `GET /rest/compile/progress/-1/-1` → fail on ERROR-severity messages\n\
- `POST /rest/projects/{id}/tests/run` + polled `GET …/tests/summary` (JSESSIONID kept across calls)
